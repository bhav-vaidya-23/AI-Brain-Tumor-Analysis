# Google Cloud Build configuration for AI Brain Tumor Analysis API
# Builds the Docker container, pushes to Google Artifact Registry / Container Registry,
# and deploys to Cloud Run with 2Gi memory and 2 vCPUs.

steps:
  # 1. Build the container image using root Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/brain-tumor-mri-api:$COMMIT_SHA'
      - '.'

  # 2. Push image to registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/brain-tumor-mri-api:$COMMIT_SHA'

  # 3. Deploy to Cloud Run with recommended ML resource allocations
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'brain-tumor-mri-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/brain-tumor-mri-api:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--concurrency'
      - '1'
      - '--timeout'
      - '300'

substitutions:
  _REGION: 'us-central1'

images:
  - 'gcr.io/$PROJECT_ID/brain-tumor-mri-api:$COMMIT_SHA'
