services:
  - type: web
    name: brain-tumor-mri-api
    runtime: python
    region: oregon
    plan: standard
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app
    healthCheckPath: /api/health
